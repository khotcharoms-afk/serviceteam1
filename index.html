<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ServiceLog" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" />
    <style>
      /* ฟอนต์หลักของทั้งแอป — โหลดที่นี่ที่เดียว ทุกหน้าได้ฟอนต์เดียวกันแม้หน้านั้นไม่ได้โหลดเอง */
      *, *::before, *::after { box-sizing: border-box; }
      :root { --c-bg:#fafafa; --c-card:#ffffff; --c-border:#e4e4e7; --c-soft:#f4f4f5; --c-text900:#09090b; --c-text500:#52525b; --c-text400:#a1a1aa; }
      /* Geist สำหรับอังกฤษ/ตัวเลข + Noto Sans Thai สำหรับภาษาไทย (เบราว์เซอร์เลือกตามตัวอักษรเอง) */
      body { margin: 0; font-family: 'Geist', 'Noto Sans Thai', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "cv11", "ss01"; font-variant-numeric: tabular-nums; }
      button, input, textarea, select { font-family: inherit; font-variant-numeric: tabular-nums; }
      :focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
      button { transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out, opacity .15s ease-out; }
      /* ตัวโหลดแบบ pixel-grid + ข้อความ shimmer (Beautiful UI) */
      .sl-pixels { display:grid; grid-template-columns:repeat(3,5px); gap:3px; }
      .sl-pixels i { width:5px; height:5px; border-radius:1px; background:#2563eb; animation:sl-px 1.2s infinite; }
      @keyframes sl-px { 0%,100% { opacity:.15 } 50% { opacity:1 } }
      .sl-shimmer { background:linear-gradient(90deg,#a1a1aa 0%,#52525b 50%,#a1a1aa 100%); background-size:200% 100%;
        -webkit-background-clip:text; background-clip:text; color:transparent; animation:sl-sh 2s linear infinite; }
      @keyframes sl-sh { from { background-position:100% 0 } to { background-position:-100% 0 } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
    <title>ServiceLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
